<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<script src="lib/gsap.min.js"></script>
<script src="lib/stage.js"></script>
<script src="styles/{{STYLE}}/{{STYLE}}.js"></script>
<style>
@font-face { font-family: "EB Garamond"; font-style: normal; font-weight: 400; src: url("lib/fonts/eb-garamond-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "EB Garamond"; font-style: italic; font-weight: 400; src: url("lib/fonts/eb-garamond-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "EB Garamond"; font-style: normal; font-weight: 500; src: url("lib/fonts/eb-garamond-latin-500-normal.woff2") format("woff2"); }
html, body { margin: 0; background: #000; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0504; }
#stage { position: absolute; inset: 0; }
#stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .18; background-size: 200px 200px; }
.black { position: absolute; inset: 0; background: #000; pointer-events: none; }
.caption { position: absolute; left: 160px; right: 160px; bottom: 74px; text-align: center; font-family: "EB Garamond", Georgia, serif; font-style: italic; font-size: 54px; line-height: 1.25; color: #fff1d6;
  text-shadow: 0 0 10px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.85), 0 2px 3px #000; text-wrap: balance; }
.titlecard { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; color: #fbe6c0; font-family: "EB Garamond", Georgia, serif; text-shadow: 0 0 18px rgba(0,0,0,.9); z-index: 3; }
.titlecard .small { font-size: 34px; letter-spacing: .3em; text-transform: uppercase; color: #d8a547; }
.titlecard .big { font-size: 112px; font-weight: 500; line-height: 1; }
.playbtn { position: fixed; top: 20px; left: 20px; z-index: 9; font: 600 24px sans-serif; padding: 12px 22px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
  <div id="stage" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></div>
  <audio id="vo" src="voice.wav" data-start="0" data-duration="{{VOICE}}" data-track-index="2" data-volume="1"></audio>
</div>
<script>window.TIMINGS = {{TIMINGS}};</script>
<script src="scenes.js"></script>
</body>
</html>
